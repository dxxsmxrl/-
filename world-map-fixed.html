<title>عالم أمينة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, addDoc,
  updateDoc, deleteDoc, serverTimestamp, query, orderBy, limit }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6LtedkEzOcYnPSJF0J1Kax2SvCDk8ym8",
  authDomain: "amina-c23a5.firebaseapp.com",
  projectId: "amina-c23a5",
  storageBucket: "amina-c23a5.firebasestorage.app",
  messagingSenderId: "884214548259",
  appId: "1:884214548259:web:9babd7cc5cb6ce3f8fae96"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

window.__db = db;
window.__fbSetCountry = async (code, data) => {
  await setDoc(doc(db, 'world', code), { ...data, updatedAt: serverTimestamp() }, { merge: true });
};
window.__fbDeleteCountry = async (code) => {
  await deleteDoc(doc(db, 'world', code));
};
window.__fbListenWorld = (cb, onErr) => {
  return onSnapshot(collection(db, 'world'), snap => {
    const data = {};
    snap.forEach(d => { data[d.id] = d.data(); });
    cb(data);
  }, err => {
    if (onErr) onErr(err);
    else console.error('world snapshot error:', err);
  });
};
window.__fbAddComment = async (code, text, author) => {
  if (!code) throw new Error('no code');
  const countryRef = doc(db, 'world', code);
  await setDoc(countryRef, { _exists: true }, { merge: true });
  await addDoc(collection(db, 'world', code, 'comments'), {
    text, author, ts: serverTimestamp()
  });
};
window.__fbListenComments = (code, cb) => {
  if (!code) { cb([]); return () => {}; }
  const q = query(collection(db, 'world', code, 'comments'), orderBy('ts', 'asc'), limit(50));
  return onSnapshot(q, snap => {
    cb(snap.docs.map(d => ({ id: d.id, ...d.data() })));
  }, (err) => {
    if (err.code !== 'permission-denied') console.warn('comments listen error', err);
    cb([]);
  });
};
window.__fbDeleteComment = async (code, id) => {
  if (!code || !id) return;
  await deleteDoc(doc(db, 'world', code, 'comments', id));
};

// Veto system
window.__fbSetVeto = async (code, vetoData) => {
  await setDoc(doc(db, 'vetos', code), { ...vetoData, ts: serverTimestamp() }, { merge: true });
};
window.__fbListenVetos = (cb) => {
  return onSnapshot(collection(db, 'vetos'), snap => {
    const data = {};
    snap.forEach(d => { data[d.id] = d.data(); });
    cb(data);
  });
};
window.__fbClearVeto = async (code) => {
  await deleteDoc(doc(db, 'vetos', code));
};

window.__fbReady = true;
window.dispatchEvent(new Event('fbready'));
</script>

/* subtle scanline texture on dark */

/* corner accents */

/* Photos */
.photos-grid { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }

  letter-spacing:1.5px; cursor:pointer; transition:all .15s; text-transform:uppercase;

.upload-photo-btn:hover { border-color:var(--acc2); color:var(--acc2); }

/* Comments / Dispatch */
.comments-list {
  max-height:200px; overflow-y:auto;
  display:flex; flex-direction:column; gap:5px; margin-bottom:8px;
}
.comment {
  display:flex; gap:8px; padding:8px 10px;
  background:var(--bg3); border:1px solid var(--border);
  position:relative; overflow:hidden;
}
.comment::before {
  content:''; position:absolute; left:0; top:0; bottom:0; width:2px;
  background:var(--acc2); opacity:.4;
}
.comment.own::before { background:var(--map-cap); opacity:.6; }
.comment-author { font-family:'DM Mono',monospace; font-size:8px; color:var(--acc2); letter-spacing:1.5px; margin-bottom:3px; }
.comment.own .comment-author { color:#6eda8a; }
.comment-text { font-family:'DM Mono',monospace; font-size:11px; color:var(--t1); line-height:1.45; }
.comment-del { background:none; border:none; color:var(--t3); cursor:pointer; font-size:10px; padding:0; align-self:flex-start; transition:color .15s; margin-left:auto; flex-shrink:0; }
.comment-del:hover { color:var(--acc); }
.comment-input-row { display:flex; gap:6px; }
.comment-input {
  flex:1; background:var(--bg3); border:1px solid var(--border2);
  color:var(--t1); padding:8px 10px;
  font-family:'DM Mono',monospace; font-size:11px;
  outline:none; transition:border-color .15s;

.comment-input:focus { border-color:var(--acc2); }
.comment-send {
  padding:8px 14px; background:var(--acc); border:none;
  color:#fff; font-family:'DM Mono',monospace; font-size:8px;
  letter-spacing:1.5px; text-transform:uppercase;
  cursor:pointer; transition:all .15s;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.1);
}
.comment-send:hover { opacity:.85; }
.comment-send:disabled { opacity:.4; cursor:not-allowed; }
.empty-state { text-align:center; padding:20px 0; font-size:10px; color:var(--t3); font-family:'DM Mono',monospace; letter-spacing:1px; }

/* Veto action button */
.veto-btn {
  width:100%; padding:9px; margin-top:4px;
  background:transparent; border:1px solid var(--des-border); color:#e0a0a0;
  font-family:'DM Mono',monospace; font-size:8px;
  letter-spacing:1.5px; text-transform:uppercase;
  cursor:pointer; transition:all .15s;
}
.veto-btn:hover { background:var(--des); border-color:#e07070; }

/* ══════════════════════════════════════════════════════
   MAP CONTROLS (legend + random route)
══════════════════════════════════════════════════════ */
.map-controls {
  position:absolute; bottom:24px; left:16px;
  display:flex; flex-direction:column; gap:8px;
  z-index:200; pointer-events:none;
}
.legend {
  background:var(--bg2); border:1px solid var(--border);
  padding:10px 14px; pointer-events:all;
  box-shadow:var(--shadow-sm);
  position:relative; overflow:hidden;
}
.legend::before {
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, rgba(200,146,58,.3), transparent);
}
.legend-title { font-family:'DM Mono',monospace; font-size:7px; letter-spacing:3px; color:var(--t3); text-transform:uppercase; margin-bottom:8px; }
.legend-item { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
.legend-dot { width:7px; height:7px; flex-shrink:0; }
.legend-label { font-family:'DM Mono',monospace; font-size:9px; color:var(--t2); letter-spacing:.5px; }

.random-route-btn {
  background:var(--bg2); border:1px solid var(--cru-border);
  color:var(--acc2); font-family:'DM Mono',monospace; font-size:9px;
  letter-spacing:2px; text-transform:uppercase;
  padding:9px 14px; cursor:pointer; transition:all .18s;
  pointer-events:all;
  display:flex; align-items:center; gap:6px;
  box-shadow:var(--shadow-sm);
}
.random-route-btn:hover { background:var(--cru); box-shadow:0 0 20px rgba(200,146,58,.25); }
.random-route-btn::before { content:'✈'; font-size:12px; }

/* ══════════════════════════════════════════════════════
   LIGHTBOX
══════════════════════════════════════════════════════ */
.lightbox {
  position:fixed; inset:0; background:rgba(0,0,0,.97);
  display:none; align-items:center; justify-content:center; z-index:2000;
}
.lightbox.on { display:flex; }
.lightbox img { max-width:90vw; max-height:90vh; object-fit:contain; }
.lightbox-close { position:absolute; top:20px; right:24px; background:none; border:none; color:#fff; font-size:22px; cursor:pointer; opacity:.5; transition:opacity .15s; }
.lightbox-close:hover { opacity:1; }

/* ══════════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════════ */
.toast {
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
  background:var(--bg3); border:1px solid var(--border2);
  color:var(--t1); padding:8px 18px;
  font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.5px;
  box-shadow:var(--shadow-sm); z-index:3000;
  animation:toastIn .18s ease; pointer-events:none;
  white-space:nowrap; max-width:90vw; overflow:hidden; text-overflow:ellipsis;
}
.toast.err { border-color:var(--des-border); color:#e07070; }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(5px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

/* ══════════════════════════════════════════════════════
   COUNTRY TOOLTIP
══════════════════════════════════════════════════════ */
.no-bg-tooltip .leaflet-tooltip {
  background:none !important; border:none !important;
  box-shadow:none !important; padding:0 !important;
}
.country-tooltip {
  background:var(--bg2); border:1px solid var(--border2);
  color:var(--t1); padding:4px 10px;
  font-family:'DM Mono',monospace; font-size:9px;
  letter-spacing:1px; pointer-events:none; white-space:nowrap;
}

/* Map animations */
@keyframes targetGlow { 0%,100%{opacity:.7}50%{opacity:1} }
@keyframes crusadeFlicker { 0%,100%{opacity:1}40%{opacity:.65}60%{opacity:.9} }

/* ══════════════════════════════════════════════════════
   MOBILE
══════════════════════════════════════════════════════ */
.sidebar-toggle {
  display:none; position:fixed; bottom:24px; right:16px; z-index:500;
  width:42px; height:42px;
  background:var(--acc); border:none; color:#fff;
  font-size:18px; cursor:pointer;
  align-items:center; justify-content:center;
  box-shadow:var(--glow-red);
}
@media (max-width:768px) {
  .sidebar { position:absolute; right:0; top:0; bottom:0; width:290px; transform:translateX(100%); transition:transform .28s cubic-bezier(.4,0,.2,1); border-left:1px solid var(--border); }
  .sidebar.open { transform:translateX(0); }
  .sidebar.collapsed { transform:translateX(100%); width:290px; }
  body.sb-open #map { filter:brightness(.4); }
  .stat-badge { display:none; }
  .tb-progress { display:none; }
}

/* ══════════════════════════════════════════════════════
   RANDOM ROUTE MODAL
══════════════════════════════════════════════════════ */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.88);
  display:none; align-items:center; justify-content:center; z-index:1500;
}
.modal-overlay.on { display:flex; }
.modal-box {
  background:var(--bg2); border:1px solid var(--border2);
  padding:44px; max-width:340px; width:90%;
  text-align:center; box-shadow:var(--shadow);
  animation:toastIn .22s ease;
  position:relative; overflow:hidden;
}
.modal-box::before, .modal-box::after {
  content:''; position:absolute; width:24px; height:24px;
  border-color:var(--acc2); border-style:solid;
}
.modal-box::before { top:-1px; left:-1px; border-width:1px 0 0 1px; }
.modal-box::after  { bottom:-1px; right:-1px; border-width:0 1px 1px 0; }
.modal-title { font-family:'DM Mono',monospace; font-size:8px; letter-spacing:3px; color:var(--t2); text-transform:uppercase; margin-bottom:16px; }
.modal-country {
  font-family:var(--font-head); font-size:26px; letter-spacing:3px; text-transform:uppercase;
  color:var(--t1); margin-bottom:8px;
}
body.monke .modal-country { font-family:var(--font-serif); font-size:34px; letter-spacing:0; text-transform:none; }
.modal-flag { font-size:44px; margin-bottom:14px; display:block; }
.modal-sub { font-family:'DM Mono',monospace; font-size:9px; color:var(--acc2); letter-spacing:2px; margin-bottom:28px; }
.modal-close-btn {
  padding:10px 28px; background:var(--acc); border:none;
  color:#fff; font-family:'DM Mono',monospace; font-size:9px;
  letter-spacing:2.5px; text-transform:uppercase; cursor:pointer; transition:all .18s;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.1);
}
.modal-close-btn:hover { opacity:.85; }

/* sync status */
#sync-status {
  position:fixed; bottom:8px; right:16px;
  font-family:'DM Mono',monospace; font-size:8px; letter-spacing:1px;
  color:var(--t3); z-index:100; pointer-events:none;
}

/* clearfix */
.clearfix::after { content:''; display:table; clear:both; }
</style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ══════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════ */
let currentUser = null;
let currentTheme = 'dark';
let selectedCountry = null;
let worldData = {};
let vetoData = {};
let commentUnsub = null;
let worldUnsub = null;
let vetoUnsub = null;
let map = null;
let geojsonLayer = null;
const TOTAL_COUNTRIES = 195;

/* ══════════════════════════════════════════════════════
   MAP COLOR CONSTANTS
   Hard-coded hex values — never read from CSS vars at render time
   to avoid getComputedStyle race conditions.
══════════════════════════════════════════════════════ */
const COLORS = {
  dark: {
    cap: '#1e4a30', tgt: '#1a1a5e', des: '#3d1010', cru: '#7a4400',
    none: '#131320', border: '#000', borderTgt: '#3030a0', borderCru: '#c8962a',
    borderDes: '#5c1515', hover: '#888'
  },
  monke: {
    cap: '#5a9068', tgt: '#5a5aaa', des: '#aa5858', cru: '#b88020',
    none: '#c0b5a0', border: '#9a8f7a', borderTgt: '#4a5fa8', borderCru: '#8b6010',
    borderDes: '#8b4040', hover: '#666'
  }
};

function getColors() {
  return document.body.classList.contains('monke') ? COLORS.monke : COLORS.dark;
}

/* ══════════════════════════════════════════════════════
   AUTH
══════════════════════════════════════════════════════ */
function selectUser(u) {
  currentUser = u;
  document.getElementById('ubtn-a').classList.toggle('selected', u === 'A');
  document.getElementById('ubtn-b').classList.toggle('selected', u === 'B');
  document.getElementById('enter-btn').disabled = false;
}
function selectTheme(t) {
  currentTheme = t;
  document.getElementById('tbtn-dark').classList.toggle('active', t === 'dark');
  document.getElementById('tbtn-monke').classList.toggle('active', t === 'monke');
  document.body.classList.toggle('monke', t === 'monke');
}
function enterApp() {
  if (!currentUser) return;
  document.getElementById('auth').style.display = 'none';
  document.getElementById('app').classList.add('on');
  const name = currentUser === 'A' ? 'marl' : 'amina';
  document.getElementById('tb-username').textContent = name;
  document.body.classList.toggle('monke', currentTheme === 'monke');
  initMap();
  initFirebase();
  if (window.innerWidth <= 768) document.getElementById('sb-toggle-btn').style.display = 'flex';
}

/* ══════════════════════════════════════════════════════
   THEME TOGGLE
══════════════════════════════════════════════════════ */
function toggleThemeApp() {
  currentTheme = currentTheme === 'dark' ? 'monke' : 'dark';
  document.body.classList.toggle('monke', currentTheme === 'monke');
  if (map && tileLayer) { map.removeLayer(tileLayer); }
  if (map) {
    const tileUrl = currentTheme === 'monke'
      ? 'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png'
      : 'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png';
    tileLayer = L.tileLayer(tileUrl, { subdomains:'abcd', maxZoom:20, opacity:0 }).addTo(map);
  }
  // Re-style every layer individually to ensure correct colors after theme change
  if (geojsonLayer) {
    geojsonLayer.eachLayer(layer => {
      if (layer.feature) {
        layer.setStyle(buildStyle(layer.feature));
      }
    });
  }
  toast(currentTheme === 'monke' ? '◦ For Monke' : '▪ for marl');
}

/* ══════════════════════════════════════════════════════
   SIDEBAR
══════════════════════════════════════════════════════ */
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  if (window.innerWidth <= 768) {
    sb.classList.toggle('open');
    document.body.classList.toggle('sb-open', sb.classList.contains('open'));
  } else {
    sb.classList.toggle('collapsed');
  }
}
function closeSidebar() {
  const sb = document.getElementById('sidebar');
  if (window.innerWidth <= 768) { sb.classList.remove('open'); document.body.classList.remove('sb-open'); }
  else sb.classList.add('collapsed');
}
function openSidebar() {
  const sb = document.getElementById('sidebar');
  if (window.innerWidth <= 768) { sb.classList.add('open'); document.body.classList.add('sb-open'); }
  else sb.classList.remove('collapsed');
}

/* ══════════════════════════════════════════════════════
   FIREBASE
══════════════════════════════════════════════════════ */
function initFirebase() {
  if (!window.__fbReady) { window.addEventListener('fbready', initFirebase, { once:true }); return; }
  setSyncStatus('connected');

  if (worldUnsub) worldUnsub();
  worldUnsub = window.__fbListenWorld(
    data => {
      worldData = data || {};
      refreshAllStyles();
      updateStats();
      if (selectedCountry) renderSidebar(selectedCountry.code, selectedCountry.name);
    },
    err => {
      setSyncStatus(err.code === 'permission-denied' ? 'permission' : 'error');
      toast('⚠ Firebase: ' + (err.code === 'permission-denied'
        ? 'нет доступа — открой Firebase Console → Firestore → Rules'
        : err.message), true);
    }
  );

  if (vetoUnsub) vetoUnsub();
  vetoUnsub = window.__fbListenVetos(data => {
    vetoData = data || {};
    const now = Date.now();
    for (const code in vetoData) {
      const v = vetoData[code];
      if (v.expires && v.expires < now) {
        window.__fbClearVeto(code);
        delete vetoData[code];
      }
    }
    if (selectedCountry) renderVetoBadge(selectedCountry.code);
  });
}

function setSyncStatus(s) {
  const el = document.getElementById('sync-status');
  if (!el) return;
  if (s === 'connected') { el.textContent = ''; el.style.cssText=''; return; }
  if (s === 'permission') {
    el.textContent = '⚠ FIRESTORE: нет прав — открой Firebase Console → Firestore → Rules → allow read, write: if true;';
    Object.assign(el.style, { color:'#ff6b6b', fontSize:'9px', bottom:'24px', right:'24px', left:'24px',
      textAlign:'center', pointerEvents:'auto', background:'rgba(40,6,6,0.97)',
      padding:'8px 12px', border:'1px solid #6b1c1c', zIndex:'9999' });
  }
}

/* ══════════════════════════════════════════════════════
   MAP
══════════════════════════════════════════════════════ */
let tileLayer = null;

function initMap() {
  if (typeof L === 'undefined') { setTimeout(initMap, 100); return; }
  map = L.map('map', { center:[20,10], zoom:2, minZoom:1, maxZoom:8, zoomControl:true, attributionControl:false });
  const tileUrl = document.body.classList.contains('monke')
    ? 'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png'
    : 'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png';
  tileLayer = L.tileLayer(tileUrl, { subdomains:'abcd', maxZoom:20, opacity:0 }).addTo(map);
  loadGeoJSON();
}

async function loadGeoJSON() {
  try {
    const res = await fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson');
    const data = await res.json();
    renderGeoJSON(data);
  } catch(e) {
    toast('map data load failed', true);
  }
}

// ISO3 → ISO2 for edge cases
const ISO3_TO_ISO2 = {
  'FRA':'FR','NOR':'NO','SWE':'SE','FIN':'FI','DNK':'DK','RUS':'RU',
  'KOS':'XK','PSE':'PS','ESH':'EH','ATC':'AQ','SJM':'SJ','GUF':'GF',
  'REU':'RE','MTQ':'MQ','GLP':'GP','MYT':'YT','NCL':'NC','PYF':'PF',
  'SPM':'PM','WLF':'WF','BLM':'BL','MAF':'MF','TWN':'TW','SAH':'EH',
  'ISL':'IS'
};

function getCountryCode(props) {
  let code = props.ISO_A2 || props.iso_a2 || '';
  if (!code || code === '-99') {
    const a3 = props.ISO_A3 || props.iso_a3 || props.ADM0_A3 || '';
    code = ISO3_TO_ISO2[a3] || a3 || (props.ADMIN||'').slice(0,3).toUpperCase();
  }
  return code;
}

/*
  ⚡ FIX: buildStyle computes style from scratch using hard-coded hex values.
  This avoids getComputedStyle() race conditions where CSS variable
  resolution returns empty string, causing Leaflet to paint all features
  with the same fallback color.
*/
function buildStyle(feature) {
  const code = getCountryCode(feature.properties);
  const data = worldData[code];
  const status = data ? data.status : null;
  const C = getColors();
  const veto = vetoData[code];
  const isVetoed = veto && veto.expires > Date.now();

  let fillColor = C.none;
  let fillOpacity = 0.82;
  let weight = 0.5;
  let color = C.border;
  let dashArray = null;

  if (isVetoed && status === 'target') {
    fillColor = C.des; dashArray = '3,3'; color = C.borderDes; weight = 1.5;
  } else {
    switch (status) {
      case 'captured':
        fillColor = C.cap; fillOpacity = 0.85;
        break;
      case 'target':
        fillColor = C.tgt; fillOpacity = 0.75;
        dashArray = '4,4'; color = C.borderTgt; weight = 1.5;
        break;
      case 'destroyed':
        fillColor = C.des; fillOpacity = 0.78;
        dashArray = '2,3'; color = C.borderDes; weight = 1;
        break;
      case 'crusade':
        fillColor = C.cru; fillOpacity = 0.85;
        dashArray = '6,3'; color = C.borderCru; weight = 1.5;
        break;
      default:
        fillOpacity = document.body.classList.contains('monke') ? 0.65 : 0.88;
    }
  }
  return { fillColor, fillOpacity, weight, color, dashArray };
}

function refreshAllStyles() {
  if (!geojsonLayer) return;
  geojsonLayer.eachLayer(layer => {
    if (layer.feature) layer.setStyle(buildStyle(layer.feature));
  });
}

function onEachFeature(feature, layer) {
  const name = feature.properties.ADMIN || feature.properties.name || feature.properties.NAME || 'Unknown';
  const code = getCountryCode(feature.properties);
  const C = getColors();

  layer.on({
    mouseover: (e) => {
      const l = e.target;
      const st = worldData[code]?.status;
      if (!st) l.setStyle({ fillOpacity: 0.95, weight: 1.2, color: getColors().hover });
      else l.setStyle({ weight: 2, fillOpacity: 1 });
      l.bringToFront();
      l.bindTooltip(`<div class="country-tooltip">${name}</div>`, { sticky:true, className:'no-bg-tooltip' }).openTooltip();
    },
    mouseout: (e) => {
      if (geojsonLayer && e.target.feature) {
        e.target.setStyle(buildStyle(e.target.feature));
      }
      e.target.closeTooltip();
    },
    click: () => {
      selectedCountry = { code, name };
      renderSidebar(code, name);
      openSidebar();
    }
  });
}

function renderGeoJSON(data) {
  if (geojsonLayer) geojsonLayer.remove();
  geojsonLayer = L.geoJSON(data, {
    style: feature => buildStyle(feature),
    onEachFeature
  }).addTo(map);
  updateStats();
}

/* ══════════════════════════════════════════════════════
   STATS
══════════════════════════════════════════════════════ */
function updateStats() {
  let cap=0, tgt=0, des=0, cru=0;
  for (const code in worldData) {
    const s = worldData[code]?.status;
    if (s==='captured') cap++;
    else if (s==='target') tgt++;
    else if (s==='destroyed') des++;
    else if (s==='crusade') cru++;
  }
  const pct = Math.round((cap / TOTAL_COUNTRIES) * 100);
  document.getElementById('pct-label').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('cap-count').textContent = cap + '/' + TOTAL_COUNTRIES;
  document.getElementById('cnt-cap').textContent = cap;
  document.getElementById('cnt-tgt').textContent = tgt;
  document.getElementById('cnt-cru').textContent = cru;
}

/* ══════════════════════════════════════════════════════
   SIDEBAR RENDER
══════════════════════════════════════════════════════ */
function renderSidebar(code, name) {
  document.getElementById('sb-name').textContent = name;
  document.getElementById('sb-code').textContent = code;
  document.getElementById('sb-status-row').style.display = 'flex';

  const currentStatus = (worldData[code] || {}).status;
  document.querySelectorAll('.status-pill').forEach(btn => btn.classList.remove('active'));
  if (currentStatus) {
    const map = { captured:'cap', target:'tgt', destroyed:'des', crusade:'cru' };
    const cls = map[currentStatus];
    if (cls) document.querySelector(`.status-pill.${cls}`)?.classList.add('active');
  }

  renderVetoBadge(code);

  const data = worldData[code] || {};
  const body = document.getElementById('sb-body');
  const ytLink = data.ytLink || '';
  const isMarl = currentUser === 'A';
  const veto = vetoData[code];
  const isVetoed = veto && veto.expires > Date.now();

  const vetoHtml = isMarl && data.status === 'target' && !isVetoed
    ? `<button class="veto-btn" onclick="applyVeto()">⊘ наложить вето — «Не доросла»</button>`
    : '';

  body.innerHTML = `
    <!-- NOTES -->
    <div class="sidebar-section">
      <div class="sec-label">intel / notes</div>
      <textarea class="notes-area" id="notes-area" placeholder="Add intelligence notes...">${esc(data.notes || '')}</textarea>
      <div class="clearfix"><button class="save-notes-btn" onclick="saveNotes()">save intel</button></div>
    </div>

    <!-- YOUTUBE TRACK -->
    <div class="sidebar-section">
      <div class="sec-label">🎵 associated track</div>
      ${ytLink
        ? `<div class="yt-link-saved">
            <a href="${esc(ytLink)}" target="_blank" rel="noopener">▶ open on youtube</a>
            <button class="yt-del-btn" onclick="removeYtLink()" title="remove">✕</button>
           </div>`
        : `<div class="yt-input-row">
            <input class="yt-input" id="yt-input" placeholder="paste youtube link...">
            <button class="yt-btn" onclick="saveYtLink()">save</button>
           </div>`
      }
    </div>

    <!-- PHOTOS -->
    <div class="sidebar-section">
      <div class="sec-label">field photos</div>
      <div class="photos-grid" id="photos-grid"></div>
      <button class="upload-photo-btn" onclick="triggerPhotoUpload()">+ upload photo</button>
    </div>

    <!-- VETO (marl only) -->
    ${vetoHtml ? `<div class="sidebar-section">${vetoHtml}</div>` : ''}

    <!-- COMMENTS / DISPATCH -->
    <div class="sidebar-section">
      <div class="sec-label">dispatch / comms</div>
      <div class="comments-list" id="comments-list"><div class="empty-state">no dispatches yet</div></div>
      <div class="comment-input-row">
        <input class="comment-input" id="comment-input" placeholder="send dispatch..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendComment();}">
        <button class="comment-send" id="comment-send-btn" onclick="sendComment()">send</button>
      </div>
    </div>
  `;

  renderPhotos(data.photos || []);

  if (commentUnsub) { commentUnsub(); commentUnsub = null; }
  if (window.__fbReady) {
    commentUnsub = window.__fbListenComments(code, renderComments);
  }
}

function renderVetoBadge(code) {
  const el = document.getElementById('sb-veto-display');
  if (!el) return;
  const veto = vetoData[code];
  const now = Date.now();
  if (veto && veto.expires > now) {
    const days = Math.ceil((veto.expires - now) / 86400000);
    el.innerHTML = `<div class="veto-badge">
      ⊘ ВЕТО — «Не доросла»
      <div class="veto-expires">заблокировано ещё ${days} дн.</div>
    </div>`;
  } else {
    el.innerHTML = '';
  }
}

function renderPhotos(photos) {
  const grid = document.getElementById('photos-grid');
  if (!grid) return;
  grid.innerHTML = '';
  (photos || []).forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'photo-thumb';
    div.innerHTML = `<img src="${p}" alt="photo"><button class="del-photo" onclick="deletePhoto(${i},event)">✕</button>`;
    div.querySelector('img').onclick = () => openLightbox(p);
    grid.appendChild(div);
  });
}

function renderComments(comments) {
  const list = document.getElementById('comments-list');
  if (!list) return;
  if (!comments.length) { list.innerHTML = '<div class="empty-state">no dispatches yet</div>'; return; }
  const myName = currentUser === 'A' ? 'marl' : 'amina';
  list.innerHTML = '';
  comments.forEach(c => {
    const div = document.createElement('div');
    const isOwn = c.author === myName;
    div.className = 'comment' + (isOwn ? ' own' : '');
    div.innerHTML = `
      <div style="flex:1;min-width:0">
        <div class="comment-author">${esc(c.author || '?')}</div>
        <div class="comment-text">${esc(c.text)}</div>
      </div>
      ${isOwn ? `<button class="comment-del" onclick="deleteComment('${c.id}')">✕</button>` : ''}
    `;
    list.appendChild(div);
  });
  list.scrollTop = list.scrollHeight;
}

/* ══════════════════════════════════════════════════════
   ACTIONS
══════════════════════════════════════════════════════ */
function setStatus(status) {
  if (!selectedCountry || !window.__fbReady) { toast('select a country first'); return; }
  const code = selectedCountry.code;

  const veto = vetoData[code];
  if (status === 'target' && veto && veto.expires > Date.now()) {
    toast('⊘ вето активно — «Не доросла»');
    return;
  }

  // Build new data WITHOUT _exists flag polluting status
  const existing = worldData[code] || {};
  const newData = {
    notes: existing.notes || '',
    ytLink: existing.ytLink || '',
    photos: existing.photos || [],
    status,
    setBy: currentUser
  };

  // Optimistic UI update — store in worldData and redraw just this country
  worldData[code] = newData;
  updateOneCountry(code);
  updateStats();

  // Update active pill
  document.querySelectorAll('.status-pill').forEach(btn => btn.classList.remove('active'));
  const pillMap = { captured:'cap', target:'tgt', destroyed:'des', crusade:'cru' };
  const cls = pillMap[status];
  if (cls) document.querySelector(`.status-pill.${cls}`)?.classList.add('active');

  window.__fbSetCountry(code, newData).catch(() => toast('sync error', true));
  toast(`${selectedCountry.name} → ${status}`);
}

function clearStatus() {
  if (!selectedCountry || !window.__fbReady) return;
  const code = selectedCountry.code;
  delete worldData[code];
  updateOneCountry(code);
  updateStats();
  document.querySelectorAll('.status-pill').forEach(btn => btn.classList.remove('active'));
  window.__fbDeleteCountry(code).catch(() => {});
  toast(`${selectedCountry.name} cleared`);
}

/* Update only the layers belonging to a single country code */
function updateOneCountry(code) {
  if (!geojsonLayer) return;
  geojsonLayer.eachLayer(layer => {
    if (!layer.feature) return;
    const c = getCountryCode(layer.feature.properties);
    if (c === code) layer.setStyle(buildStyle(layer.feature));
  });
}

function saveNotes() {
  if (!selectedCountry || !window.__fbReady) return;
  const notes = document.getElementById('notes-area')?.value || '';
  const existing = worldData[selectedCountry.code] || {};
  window.__fbSetCountry(selectedCountry.code, { ...existing, notes }).catch(() => toast('sync error', true));
  toast('intel saved');
}

/* ══════════════════════════════════════════════════════
   ⚡ FIX: sendComment — properly awaits and shows errors
══════════════════════════════════════════════════════ */
async function sendComment() {
  if (!selectedCountry || !window.__fbReady) { toast('not connected'); return; }
  const inp = document.getElementById('comment-input');
  const btn = document.getElementById('comment-send-btn');
  if (!inp) return;
  const text = inp.value.trim();
  if (!text) return;

  const authorName = currentUser === 'A' ? 'marl' : 'amina';
  inp.value = '';
  if (btn) btn.disabled = true;

  try {
    await window.__fbAddComment(selectedCountry.code, text, authorName);
  } catch(err) {
    toast('dispatch failed: ' + (err.message || err), true);
    inp.value = text; // restore on failure
  } finally {
    if (btn) btn.disabled = false;
    inp.focus();
  }
}

function deleteComment(id) {
  if (!selectedCountry || !window.__fbReady || !id) return;
  window.__fbDeleteComment(selectedCountry.code, id).catch(() => {});
}

/* ══════════════════════════════════════════════════════
   YOUTUBE LINK
══════════════════════════════════════════════════════ */
function saveYtLink() {
  if (!selectedCountry || !window.__fbReady) return;
  const inp = document.getElementById('yt-input');
  const url = inp?.value.trim();
  if (!url) return;
  const existing = worldData[selectedCountry.code] || {};
  window.__fbSetCountry(selectedCountry.code, { ...existing, ytLink: url })
    .then(() => { toast('track linked'); renderSidebar(selectedCountry.code, selectedCountry.name); })
    .catch(() => toast('sync error', true));
}

function removeYtLink() {
  if (!selectedCountry || !window.__fbReady) return;
  const existing = worldData[selectedCountry.code] || {};
  const updated = { ...existing, ytLink: '' };
  window.__fbSetCountry(selectedCountry.code, updated)
    .then(() => { toast('track removed'); renderSidebar(selectedCountry.code, selectedCountry.name); })
    .catch(() => {});
}

/* ══════════════════════════════════════════════════════
   PHOTOS
══════════════════════════════════════════════════════ */
function triggerPhotoUpload() { document.getElementById('photo-input').click(); }

function handlePhotoUpload(e) {
  const file = e.target.files[0];
  if (!file || !selectedCountry) return;
  e.target.value = '';
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 600;
      let w = img.width, h = img.height;
      if (w > MAX) { h = (h/w)*MAX; w = MAX; }
      if (h > MAX) { w = (w/h)*MAX; h = MAX; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const b64 = canvas.toDataURL('image/jpeg', 0.72);
      const existing = worldData[selectedCountry.code] || {};
      const photos = [...(existing.photos || []), b64];
      window.__fbSetCountry(selectedCountry.code, { ...existing, photos })
        .then(() => { renderPhotos(photos); toast('photo pinned'); })
        .catch(() => toast('upload failed', true));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function deletePhoto(idx, e) {
  e.stopPropagation();
  if (!selectedCountry || !window.__fbReady) return;
  const existing = worldData[selectedCountry.code] || {};
  const photos = [...(existing.photos || [])];
  photos.splice(idx, 1);
  window.__fbSetCountry(selectedCountry.code, { ...existing, photos })
    .then(() => { renderPhotos(photos); toast('photo removed'); })
    .catch(() => {});
}

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('on');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('on'); }

/* ══════════════════════════════════════════════════════
   VETO SYSTEM
══════════════════════════════════════════════════════ */
function applyVeto() {
  if (!selectedCountry || !window.__fbReady || currentUser !== 'A') return;
  const code = selectedCountry.code;
  const expires = Date.now() + 7 * 24 * 60 * 60 * 1000;
  window.__fbSetVeto(code, { by: 'marl', comment: 'Не доросла', expires })
    .then(() => {
      toast(`⊘ вето наложено на ${selectedCountry.name}`);
      renderSidebar(selectedCountry.code, selectedCountry.name);
    })
    .catch(() => toast('veto sync error', true));
}

/* ══════════════════════════════════════════════════════
   RANDOM ROUTE
══════════════════════════════════════════════════════ */
const COUNTRY_FLAGS = {
  FR:'🇫🇷',DE:'🇩🇪',JP:'🇯🇵',BR:'🇧🇷',IT:'🇮🇹',ES:'🇪🇸',PT:'🇵🇹',
  GR:'🇬🇷',TR:'🇹🇷',TH:'🇹🇭',VN:'🇻🇳',ID:'🇮🇩',MA:'🇲🇦',EG:'🇪🇬',
  TN:'🇹🇳',MX:'🇲🇽',AR:'🇦🇷',CL:'🇨🇱',CO:'🇨🇴',PE:'🇵🇪',NL:'🇳🇱',
  BE:'🇧🇪',CH:'🇨🇭',AT:'🇦🇹',CZ:'🇨🇿',PL:'🇵🇱',HU:'🇭🇺',HR:'🇭🇷',
  IS:'🇮🇸',NO:'🇳🇴',SE:'🇸🇪',DK:'🇩🇰',FI:'🇫🇮',IN:'🇮🇳',NP:'🇳🇵',
  KH:'🇰🇭',SG:'🇸🇬',MY:'🇲🇾',PH:'🇵🇭',KR:'🇰🇷',AU:'🇦🇺',NZ:'🇳🇿',
  ZA:'🇿🇦',KE:'🇰🇪',TZ:'🇹🇿',ET:'🇪🇹',GH:'🇬🇭',SN:'🇸🇳',
};

function randomRoute() {
  const targets = Object.entries(worldData).filter(([,v]) => v.status === 'target');
  if (!targets.length) { toast('no target countries yet'); return; }
  const [code] = targets[Math.floor(Math.random() * targets.length)];
  let name = code;
  if (geojsonLayer) {
    geojsonLayer.eachLayer(l => {
      const p = l.feature?.properties;
      const c = getCountryCode(p || {});
      if (c === code) name = p?.ADMIN || p?.name || p?.NAME || code;
    });
  }
  const flag = COUNTRY_FLAGS[code] || '🌍';
  document.getElementById('modal-flag').textContent = flag;
  document.getElementById('modal-country').textContent = name;
  document.getElementById('modal-sub').textContent = code + ' — selected at random';
  document.getElementById('route-modal').classList.add('on');
}

function closeRouteModal() { document.getElementById('route-modal').classList.remove('on'); }

/* ══════════════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════════════ */
function toast(msg, isErr) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* Keyboard shortcuts */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeLightbox(); closeSidebar(); closeRouteModal(); }
  if (!selectedCountry || e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA') return;
  if (e.key==='1') setStatus('captured');
  if (e.key==='2') setStatus('target');
  if (e.key==='3') setStatus('destroyed');
  if (e.key==='4') setStatus('crusade');
  if (e.key==='x'||e.key==='X') clearStatus();
});

window.addEventListener('resize', () => {
  const sb = document.getElementById('sidebar');
  if (window.innerWidth > 768) {
    sb.classList.remove('open'); document.body.classList.remove('sb-open');
    document.getElementById('sb-toggle-btn').style.display = 'none';
  } else {
    document.getElementById('sb-toggle-btn').style.display = 'flex';
  }
});
</script>
