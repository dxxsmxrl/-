<title>عالم أمينة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, addDoc,
  updateDoc, deleteDoc, serverTimestamp, query, orderBy, limit }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6LtedkEzOcYnPSJF0J1Kax2SvCDk8ym8",
  authDomain: "amina-c23a5.firebaseapp.com",
  projectId: "amina-c23a5",
  storageBucket: "amina-c23a5.firebasestorage.app",
  messagingSenderId: "884214548259",
  appId: "1:884214548259:web:9babd7cc5cb6ce3f8fae96"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
window.__db = db;

// Country data
window.__fbSetCountry = async (code, data) => {
  await setDoc(doc(db, 'world', code), { ...data, updatedAt: serverTimestamp() }, { merge: true });
};
window.__fbDeleteCountry = async (code) => {
  await deleteDoc(doc(db, 'world', code));
};
window.__fbListenWorld = (cb, onErr) => {
  return onSnapshot(collection(db, 'world'), snap => {
    const data = {};
    snap.forEach(d => { data[d.id] = d.data(); });
    cb(data);
  }, err => { if (onErr) onErr(err); else console.error('world snapshot error:', err); });
};

// FIXED: Comments stored flat in 'dispatches' collection with countryCode field
// This avoids subcollection permission issues
window.__fbAddComment = async (code, text, author) => {
  if (!code) return;
  await addDoc(collection(db, 'dispatches'), {
    countryCode: code, text, author, ts: serverTimestamp()
  });
};
window.__fbListenComments = (code, cb) => {
  if (!code) { cb([]); return () => {}; }
  // Query flat collection filtered by countryCode
  const q = query(
    collection(db, 'dispatches'),
    orderBy('ts', 'asc'),
    limit(100)
  );
  return onSnapshot(q, snap => {
    const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    cb(all.filter(c => c.countryCode === code));
  }, (err) => {
    console.warn('comments listen error', err);
    cb([]);
  });
};
window.__fbDeleteComment = async (id) => {
  if (!id) return;
  await deleteDoc(doc(db, 'dispatches', id));
};

// Veto system
window.__fbSetVeto = async (code, vetoData) => {
  await setDoc(doc(db, 'vetos', code), { ...vetoData, ts: serverTimestamp() }, { merge: true });
};
window.__fbListenVetos = (cb) => {
  return onSnapshot(collection(db, 'vetos'), snap => {
    const data = {};
    snap.forEach(d => { data[d.id] = d.data(); });
    cb(data);
  });
};
window.__fbClearVeto = async (code) => {
  await deleteDoc(doc(db, 'vetos', code));
};

window.__fbReady = true;
window.dispatchEvent(new Event('fbready'));
</script>

  background:rgba(0,0,0,.75); border:none; color:#fff; font-size:9px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .15s;
}
.photo-thumb:hover .del-photo { opacity:1; }
.upload-photo-btn {
  width:100%; padding:9px; background:transparent;
  border:1px dashed var(--border2); color:var(--t2);

}
.upload-photo-btn:hover { border-color:var(--acc2); color:var(--acc2); border-style:solid; }

/* Comments */
.comments-list { max-height:200px; overflow-y:auto; display:flex; flex-direction:column; gap:5px; margin-bottom:8px; }
.comment {
  display:flex; gap:8px; padding:9px 11px;
  background:var(--bg3); border:1px solid var(--border); border-radius:var(--r);
  transition:border-color .15s;
}
.comment:hover { border-color:var(--border2); }
.comment-author { font-family:var(--font-m); font-size:8px; color:var(--acc2); letter-spacing:1.5px; margin-bottom:3px; text-transform:uppercase; }
.comment-text { font-family:var(--font-m); font-size:11px; color:var(--t1); line-height:1.45; }
.comment-del { background:none; border:none; color:var(--t3); cursor:pointer; font-size:11px; padding:0; align-self:flex-start; transition:color .15s; margin-left:auto; flex-shrink:0; }
.comment-del:hover { color:var(--acc); }
.comment-input-row { display:flex; gap:5px; }
.comment-input {
  flex:1; background:var(--bg3); border:1px solid var(--border2);
  color:var(--t1); padding:8px 10px;

  transition:border-color .2s;
}
.comment-input:focus { border-color:var(--acc2); box-shadow:0 0 0 2px rgba(200,146,58,.06); }
.comment-input::placeholder { color:var(--t3); }
.comment-send {
  padding:8px 14px; background:var(--acc); border:none;
  color:#fff; font-family:var(--font-m); font-size:8px; letter-spacing:2px;
  text-transform:uppercase; cursor:pointer; transition:all .18s; border-radius:var(--r);
}
.comment-send:hover { background:#a02020; }

.empty-state {
  text-align:center; padding:18px 0;
  font-size:10px; color:var(--t3); font-family:var(--font-m); letter-spacing:.5px;
}
.veto-btn {
  width:100%; padding:9px; margin-top:8px; background:transparent;
  border:1px solid var(--des-b); color:#d09090;
  font-family:var(--font-m); font-size:8px; letter-spacing:2px; text-transform:uppercase;
  cursor:pointer; transition:all .18s; border-radius:var(--r);
}
.veto-btn:hover { background:var(--des); box-shadow:0 0 16px var(--des-glow); }

/* ══════════════════════════════════════════════════════
   MAP CONTROLS
══════════════════════════════════════════════════════ */
.map-controls {
  position:absolute; bottom:20px; left:14px;
  display:flex; flex-direction:column; gap:7px;
  z-index:200; pointer-events:none;
}
.legend {
  background:rgba(8,8,8,.92); border:1px solid var(--border2);
  padding:10px 14px; pointer-events:all;
  backdrop-filter:blur(12px);
}
body.monke .legend { background:rgba(232,224,204,.92); }
.legend-title { font-family:var(--font-m); font-size:7px; letter-spacing:3px; color:var(--t3); text-transform:uppercase; margin-bottom:8px; }
.legend-item { display:flex; align-items:center; gap:7px; margin-bottom:4px; }
.legend-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.legend-label { font-family:var(--font-m); font-size:9px; color:var(--t2); }
@keyframes targetGlow { 0%,100%{opacity:.65}50%{opacity:1} }
@keyframes crusadeFlicker { 0%,100%{opacity:1}40%{opacity:.65}60%{opacity:.9} }

.random-route-btn {
  background:rgba(8,8,8,.92); border:1px solid var(--cru-b);
  color:var(--acc2); font-family:var(--font-m); font-size:9px;
  letter-spacing:1.5px; text-transform:uppercase;
  padding:9px 14px; cursor:pointer; transition:all .2s;
  pointer-events:all; display:flex; align-items:center; gap:7px;
  backdrop-filter:blur(12px);
}
body.monke .random-route-btn { background:rgba(232,224,204,.92); }
.random-route-btn:hover { background:var(--cru); box-shadow:0 0 20px var(--cru-glow); }
.random-route-btn::before { content:'✈'; font-size:12px; }

/* ══════════════════════════════════════════════════════
   TOOLTIP
══════════════════════════════════════════════════════ */
.no-bg-tooltip .leaflet-tooltip { background:none !important; border:none !important; box-shadow:none !important; padding:0 !important; }
.country-tooltip {
  background:rgba(8,8,8,.9); border:1px solid var(--border2);
  color:var(--t1); padding:4px 11px;
  font-family:var(--font-m); font-size:9px; letter-spacing:1px;
  pointer-events:none; white-space:nowrap;
  backdrop-filter:blur(8px);
}
body.monke .country-tooltip { background:rgba(232,224,204,.9); }

/* ══════════════════════════════════════════════════════
   LIGHTBOX
══════════════════════════════════════════════════════ */
.lightbox {
  position:fixed; inset:0; background:rgba(0,0,0,.96);
  display:none; align-items:center; justify-content:center; z-index:2000;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.lightbox.on { display:flex; }
.lightbox img { max-width:90vw; max-height:88vh; object-fit:contain; border:1px solid var(--border2); }
.lightbox-close { position:absolute; top:20px; right:24px; background:none; border:none; color:#888; font-size:22px; cursor:pointer; transition:color .15s; }
.lightbox-close:hover { color:#fff; }

/* ══════════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════════ */
.toast {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:var(--bg3); border:1px solid var(--border2);
  color:var(--t1); padding:9px 18px;
  font-family:var(--font-m); font-size:10px; letter-spacing:.5px;
  box-shadow:var(--sh-sm); z-index:3000;
  animation:toastIn .2s cubic-bezier(.22,.68,0,1.2); pointer-events:none;
  white-space:nowrap; max-width:90vw; overflow:hidden; text-overflow:ellipsis;
}
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(8px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

/* ══════════════════════════════════════════════════════
   RANDOM ROUTE MODAL
══════════════════════════════════════════════════════ */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.88);

  backdrop-filter:blur(4px);
}
.modal-overlay.on { display:flex; animation:fadeIn .2s ease; }
.modal-box {
  background:var(--bg2); border:1px solid var(--border2);
  padding:44px 40px; max-width:340px; width:90%; text-align:center;
  box-shadow:var(--sh); position:relative;
  animation:authIn .3s cubic-bezier(.22,.68,0,1.2) both;
}
.modal-box::before {
  content:''; position:absolute; top:-1px; left:50%; transform:translateX(-50%);
  width:80px; height:1px; background:linear-gradient(90deg, transparent, var(--cru-b), transparent);
}
.modal-title { font-family:var(--font-m); font-size:8px; letter-spacing:3px; color:var(--t2); text-transform:uppercase; margin-bottom:18px; }
.modal-flag { font-size:52px; margin-bottom:16px; display:block; }
.modal-country {

}
.modal-sub { font-family:var(--font-m); font-size:9px; color:var(--acc2); letter-spacing:2px; margin-bottom:28px; }
.modal-close-btn {

}

/* ══════════════════════════════════════════════════════
   MOBILE
══════════════════════════════════════════════════════ */
.sidebar-toggle {
  display:none; position:fixed; bottom:20px; right:14px; z-index:500;
  width:42px; height:42px; background:var(--acc); border:none; color:#fff;
  font-size:18px; cursor:pointer; border-radius:var(--r);

/* Sync status */

</style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ══════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════ */
let currentUser = null;
let currentTheme = 'dark';
let selectedCountry = null;
let worldData = {};
let vetoData = {};
let commentUnsub = null;
let worldUnsub = null;
let vetoUnsub = null;
let map = null;
let geojsonLayer = null;
let tileLayer = null;
const TOTAL = 195;

/* ══════════════════════════════════════════════════════
   AUTH
══════════════════════════════════════════════════════ */
function selectUser(u) {
  currentUser = u;
  document.getElementById('ubtn-a').classList.toggle('selected', u==='A');
  document.getElementById('ubtn-b').classList.toggle('selected', u==='B');
  document.getElementById('enter-btn').disabled = false;
}
function selectTheme(t) {
  currentTheme = t;
  document.getElementById('tbtn-dark').classList.toggle('active', t==='dark');
  document.getElementById('tbtn-monke').classList.toggle('active', t==='monke');
  document.body.classList.toggle('monke', t==='monke');
}
function enterApp() {
  if (!currentUser) return;
  document.getElementById('auth').style.display = 'none';
  document.getElementById('app').classList.add('on');
  document.getElementById('tb-username').textContent = currentUser==='A' ? 'marl' : 'amina';
  document.body.classList.toggle('monke', currentTheme==='monke');
  initMap();
  initFirebase();
  if (window.innerWidth <= 768) document.getElementById('sb-toggle-btn').style.display = 'flex';
}

/* ══════════════════════════════════════════════════════
   THEME TOGGLE
══════════════════════════════════════════════════════ */
function toggleThemeApp() {
  currentTheme = currentTheme==='dark' ? 'monke' : 'dark';
  document.body.classList.toggle('monke', currentTheme==='monke');
  if (map && tileLayer) map.removeLayer(tileLayer);
  if (map) {
    const url = currentTheme==='monke'
      ? 'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png'
      : 'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png';
    tileLayer = L.tileLayer(url, { subdomains:'abcd', maxZoom:20 }).addTo(map);
  }
  // FIXED: pass function reference correctly
  if (geojsonLayer) geojsonLayer.setStyle(feature => countryStyle(feature));
  toast(currentTheme==='monke' ? '◦ For Monke' : '▪ for marl');
}

/* ══════════════════════════════════════════════════════
   SIDEBAR CONTROLS
══════════════════════════════════════════════════════ */
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  if (window.innerWidth<=768) { sb.classList.toggle('open'); document.body.classList.toggle('sb-open', sb.classList.contains('open')); }
  else sb.classList.toggle('collapsed');
}
function closeSidebar() {
  const sb = document.getElementById('sidebar');
  if (window.innerWidth<=768) { sb.classList.remove('open'); document.body.classList.remove('sb-open'); }
  else sb.classList.add('collapsed');
}
function openSidebar() {
  const sb = document.getElementById('sidebar');
  if (window.innerWidth<=768) { sb.classList.add('open'); document.body.classList.add('sb-open'); }
  else sb.classList.remove('collapsed');
}

/* ══════════════════════════════════════════════════════
   FIREBASE
══════════════════════════════════════════════════════ */
function initFirebase() {
  if (!window.__fbReady) { window.addEventListener('fbready', initFirebase, { once:true }); return; }
  setSyncStatus('connected');

  if (worldUnsub) worldUnsub();
  worldUnsub = window.__fbListenWorld(
    data => {
      worldData = data || {};
      // FIXED: pass arrow function so Leaflet calls it correctly
      if (geojsonLayer) geojsonLayer.setStyle(feature => countryStyle(feature));
      updateStats();
      if (selectedCountry) renderSidebar(selectedCountry.code, selectedCountry.name);
    },
    err => {
      const msg = err.code==='permission-denied'
        ? '⚠ Firestore: нет прав — Rules → allow read, write: if true;'
        : '⚠ Firebase: ' + err.message;
      setSyncStatus('error');
      toast(msg);
    }
  );

  if (vetoUnsub) vetoUnsub();
  vetoUnsub = window.__fbListenVetos(data => {
    vetoData = data || {};
    const now = Date.now();
    for (const code in vetoData) {
      if (vetoData[code]?.expires < now) {
        window.__fbClearVeto(code);
        delete vetoData[code];
      }
    }
    if (selectedCountry) renderVetoBadge(selectedCountry.code);
  });
}

function setSyncStatus(s) {
  const el = document.getElementById('sync-status');
  if (s==='connected') { el.textContent=''; el.style.cssText=''; return; }
  el.textContent = s==='error'
    ? '⚠ FIRESTORE: нет прав — открой Firebase Console → Firestore → Rules и поставь allow read, write: if true;'
    : '';
  if (s==='error') {
    el.style.color='#ff6b6b'; el.style.fontSize='9px'; el.style.bottom='24px';
    el.style.right='24px'; el.style.left='24px'; el.style.textAlign='center';
    el.style.pointerEvents='auto'; el.style.background='rgba(40,8,8,.96)';
    el.style.padding='8px 12px'; el.style.border='1px solid #8b1a1a'; el.style.zIndex='9999';
  }
}

/* ══════════════════════════════════════════════════════
   MAP
══════════════════════════════════════════════════════ */
function initMap() {
  if (typeof L==='undefined') { setTimeout(initMap, 100); return; }
  map = L.map('map', { center:[20,10], zoom:2, minZoom:1, maxZoom:8, zoomControl:true, attributionControl:false });
  const url = document.body.classList.contains('monke')
    ? 'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png'
    : 'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png';
  tileLayer = L.tileLayer(url, { subdomains:'abcd', maxZoom:20 }).addTo(map);
  loadGeoJSON();
}

async function loadGeoJSON() {
  try {
    const res = await fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson');
    const data = await res.json();
    renderGeoJSON(data);
  } catch(e) { toast('map load failed'); }
}

// ISO-A2 fallback mapping for problem countries
const ISO3_TO_ISO2 = {
  'FRA':'FR','NOR':'NO','SWE':'SE','FIN':'FI','DNK':'DK','RUS':'RU',
  'KOS':'XK','PSE':'PS','ESH':'EH','TWN':'TW','ISL':'IS','GUF':'GF',
  'REU':'RE','MTQ':'MQ','GLP':'GP','MYT':'YT','NCL':'NC','PYF':'PF',
};

function getCountryCode(props) {
  let code = props.ISO_A2 || props.iso_a2 || '';
  if (!code || code==='-99') {
    const a3 = props.ISO_A3 || props.iso_a3 || props.ADM0_A3 || '';
    code = ISO3_TO_ISO2[a3] || a3 || '';
  }
  return code;
}

/* ══════════════════════════════════════════════════════
   COUNTRY STYLE — FIXED
   Leaflet's setStyle(fn) calls fn(feature) per layer.
   Must always accept feature as argument.
══════════════════════════════════════════════════════ */
function countryStyle(feature) {
  const code = getCountryCode(feature.properties);
  const d = worldData[code];
  const status = d ? d.status : null;
  const isDark = !document.body.classList.contains('monke');
  const veto = vetoData[code];
  const isVetoed = veto && veto.expires > Date.now();

  const none = { fillColor: isDark ? '#111111' : '#c0b8a8', fillOpacity: isDark ? 0.85 : 0.55,
    weight: isDark ? 0.4 : 0.7, color: isDark ? '#000' : '#9a8f7a', dashArray: null };

  if (!status) return none;

  if (isVetoed && status==='target') {
    return { fillColor: isDark ? '#5c1818' : '#b05a5a', fillOpacity: 0.8,
      weight: 1.5, color: isDark ? '#8b1a1a' : '#aa6a6a', dashArray: '3,3' };
  }

  switch(status) {
    case 'captured':
      return { fillColor: isDark ? '#1e5c34' : '#5a9c6a', fillOpacity: 0.9,
        weight: isDark ? 0.5 : 0.8, color: isDark ? '#000' : '#9a8f7a', dashArray: null };
    case 'target':
      return { fillColor: isDark ? '#1e2878' : '#5a6ab0', fillOpacity: 0.75,
        weight: 1.5, color: isDark ? '#3838b0' : '#4a5aaa', dashArray: '4,4' };
    case 'destroyed':
      return { fillColor: isDark ? '#5c1818' : '#b05a5a', fillOpacity: 0.8,
        weight: isDark ? 0.6 : 0.9, color: isDark ? '#000' : '#9a8f7a', dashArray: '2,3' };
    case 'crusade':
      return { fillColor: isDark ? '#7a4800' : '#c8902a', fillOpacity: 0.85,
        weight: 1.5, color: isDark ? '#b06800' : '#a87020', dashArray: '6,3' };
    default:
      return none;
  }
}

function onEachFeature(feature, layer) {
  const name = feature.properties.ADMIN || feature.properties.name || feature.properties.NAME || 'Unknown';
  const code = getCountryCode(feature.properties);
  layer.on({
    mouseover: e => {
      const l = e.target;
      l.setStyle({ fillOpacity: Math.min((l.options.fillOpacity||0.5) + 0.15, 1), weight: Math.max((l.options.weight||0.5), 1) });
      l.bringToFront();
      l.bindTooltip(`<div class="country-tooltip">${name}</div>`, { sticky:true, className:'no-bg-tooltip' }).openTooltip();
    },
    mouseout: e => { geojsonLayer.resetStyle(e.target); e.target.closeTooltip(); },
    click: () => {
      selectedCountry = { code, name };
      renderSidebar(code, name);
      openSidebar();
    }
  });
}

function renderGeoJSON(data) {
  if (geojsonLayer) geojsonLayer.remove();
  // FIXED: use arrow function so feature is passed correctly
  geojsonLayer = L.geoJSON(data, {
    style: feature => countryStyle(feature),
    onEachFeature
  }).addTo(map);
  updateStats();
}

/* ══════════════════════════════════════════════════════
   STATS
══════════════════════════════════════════════════════ */
function updateStats() {
  let cap=0, tgt=0, des=0, cru=0;
  for (const k in worldData) {
    const s = worldData[k]?.status;
    if (s==='captured') cap++;
    else if (s==='target') tgt++;
    else if (s==='destroyed') des++;
    else if (s==='crusade') cru++;
  }
  const pct = Math.round((cap/TOTAL)*100);
  document.getElementById('pct-label').textContent = pct+'%';
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('cap-count').textContent = cap+'/'+TOTAL;
  document.getElementById('cnt-cap').textContent = cap;
  document.getElementById('cnt-tgt').textContent = tgt;
  document.getElementById('cnt-cru').textContent = cru;
}

/* ══════════════════════════════════════════════════════
   SIDEBAR RENDER
══════════════════════════════════════════════════════ */
function renderSidebar(code, name) {
  document.getElementById('sb-name').textContent = name;
  document.getElementById('sb-code').textContent = code;
  document.getElementById('sb-status-row').style.display = 'flex';

  const currentStatus = (worldData[code]||{}).status;
  document.querySelectorAll('.spill').forEach(b => b.classList.remove('active'));
  if (currentStatus) {
    const m = { captured:'cap', target:'tgt', destroyed:'des', crusade:'cru' };
    if (m[currentStatus]) document.querySelector(`.spill.${m[currentStatus]}`)?.classList.add('active');
  }
  renderVetoBadge(code);

  const data = worldData[code] || {};
  const ytLink = data.ytLink || '';
  const isMarl = currentUser==='A';
  const veto = vetoData[code];
  const isVetoed = veto && veto.expires > Date.now();
  const vetoHtml = isMarl && data.status==='target' && !isVetoed
    ? `<button class="veto-btn" onclick="applyVeto()">⊘ наложить вето — «Не доросла»</button>` : '';

  document.getElementById('sb-body').innerHTML = `
    <div class="sec">
      <div class="sec-label">intel / notes</div>
      <textarea class="notes-area" id="notes-area" placeholder="Add intelligence notes...">${esc(data.notes||'')}</textarea>
      <div style="overflow:hidden"><button class="save-notes-btn" onclick="saveNotes()">save intel</button></div>
    </div>
    <div class="sec">
      <div class="sec-label">🎵 associated track</div>
      ${ytLink
        ? `<div class="yt-link-saved">
            <a href="${esc(ytLink)}" target="_blank" rel="noopener">▶ open on youtube</a>
            <button class="yt-del-btn" onclick="removeYtLink()">✕</button>
           </div>`
        : `<div class="yt-input-row">
            <input class="yt-input" id="yt-input" placeholder="paste youtube link...">
            <button class="yt-btn" onclick="saveYtLink()">save</button>
           </div>`
      }
    </div>
    <div class="sec">
      <div class="sec-label">field photos</div>
      <div class="photos-grid" id="photos-grid"></div>
      <button class="upload-photo-btn" onclick="triggerPhotoUpload()">+ upload photo</button>
    </div>
    ${vetoHtml ? `<div class="sec">${vetoHtml}</div>` : ''}
    <div class="sec">
      <div class="sec-label">dispatch / comms</div>
      <div class="comments-list" id="comments-list"><div class="empty-state">no dispatches yet</div></div>
      <div class="comment-input-row">
        <input class="comment-input" id="comment-input" placeholder="send dispatch..." onkeydown="if(event.key==='Enter')sendComment()">
        <button class="comment-send" onclick="sendComment()">send</button>
      </div>
    </div>
  `;

  renderPhotos(data.photos||[]);

  if (commentUnsub) { commentUnsub(); commentUnsub = null; }
  if (window.__fbReady) commentUnsub = window.__fbListenComments(code, renderComments);
}

function renderVetoBadge(code) {
  const el = document.getElementById('sb-veto-display');
  if (!el) return;
  const veto = vetoData[code];
  if (veto && veto.expires > Date.now()) {
    const days = Math.ceil((veto.expires - Date.now()) / 86400000);
    el.innerHTML = `<div class="veto-badge">⊘ ВЕТО — «Не доросла»<div class="veto-expires">заблокировано ещё ${days} дн.</div></div>`;
  } else { el.innerHTML = ''; }
}

function renderPhotos(photos) {
  const grid = document.getElementById('photos-grid');
  if (!grid) return;
  grid.innerHTML = '';
  (photos||[]).forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'photo-thumb';
    div.innerHTML = `<img src="${p}" alt="" onclick="openLightbox('${p}')"><button class="del-photo" onclick="deletePhoto(${i},event)">✕</button>`;
    grid.appendChild(div);
  });
}

function renderComments(comments) {
  const list = document.getElementById('comments-list');
  if (!list) return;
  if (!comments.length) { list.innerHTML = '<div class="empty-state">no dispatches yet</div>'; return; }
  const myName = currentUser==='A' ? 'marl' : 'amina';
  list.innerHTML = '';
  comments.forEach(c => {
    const div = document.createElement('div');
    div.className = 'comment';
    div.innerHTML = `
      <div style="flex:1;min-width:0">
        <div class="comment-author">${esc(c.author||'?')}</div>
        <div class="comment-text">${esc(c.text)}</div>
      </div>
      ${c.author===myName ? `<button class="comment-del" onclick="deleteComment('${c.id}')">✕</button>` : ''}
    `;
    list.appendChild(div);
  });
  list.scrollTop = list.scrollHeight;
}

/* ══════════════════════════════════════════════════════
   ACTIONS
══════════════════════════════════════════════════════ */
function setStatus(status) {
  if (!selectedCountry || !window.__fbReady) { toast('select a country first'); return; }
  const code = selectedCountry.code;
  const veto = vetoData[code];
  if (status==='target' && veto && veto.expires > Date.now()) { toast('⊘ вето активно — «Не доросла»'); return; }

  const existing = worldData[code] || {};
  const newData = { ...existing, status, setBy: currentUser };
  worldData[code] = newData;

  // FIXED: refresh style per-feature, not globally
  if (geojsonLayer) geojsonLayer.setStyle(feature => countryStyle(feature));
  updateStats();
  renderVetoBadge(code);
  // Update active pill
  document.querySelectorAll('.spill').forEach(b => b.classList.remove('active'));
  const m = { captured:'cap', target:'tgt', destroyed:'des', crusade:'cru' };
  if (m[status]) document.querySelector(`.spill.${m[status]}`)?.classList.add('active');

  window.__fbSetCountry(code, newData).catch(() => toast('sync error'));
  toast(`${selectedCountry.name} → ${status}`);
}

function clearStatus() {
  if (!selectedCountry || !window.__fbReady) return;
  const code = selectedCountry.code;
  delete worldData[code];
  if (geojsonLayer) geojsonLayer.setStyle(feature => countryStyle(feature));
  updateStats();
  document.querySelectorAll('.spill').forEach(b => b.classList.remove('active'));
  window.__fbDeleteCountry(code).catch(()=>{});
  toast(`${selectedCountry.name} cleared`);
}

function saveNotes() {
  if (!selectedCountry || !window.__fbReady) return;
  const notes = document.getElementById('notes-area')?.value || '';
  const existing = worldData[selectedCountry.code] || {};
  window.__fbSetCountry(selectedCountry.code, { ...existing, notes }).catch(() => toast('sync error'));
  toast('intel saved');
}

// FIXED: sendComment uses flat collection, no subcollection issues
function sendComment() {
  if (!selectedCountry || !window.__fbReady) return;
  const inp = document.getElementById('comment-input');
  const text = inp?.value.trim();
  if (!text) return;
  const author = currentUser==='A' ? 'marl' : 'amina';
  inp.value = '';
  window.__fbAddComment(selectedCountry.code, text, author)
    .then(() => {}) // listener will update UI automatically
    .catch(err => { console.error('comment error:', err); toast('dispatch failed: ' + err.message); });
}

function deleteComment(id) {
  if (!id || !window.__fbReady) return;
  // FIXED: delete by flat doc id, not subcollection path
  window.__fbDeleteComment(id).catch(()=>{});
}

function saveYtLink() {
  if (!selectedCountry || !window.__fbReady) return;
  const url = document.getElementById('yt-input')?.value.trim();
  if (!url) return;
  const existing = worldData[selectedCountry.code] || {};
  window.__fbSetCountry(selectedCountry.code, { ...existing, ytLink: url })
    .then(() => { toast('track linked'); renderSidebar(selectedCountry.code, selectedCountry.name); })
    .catch(() => toast('sync error'));
}

function removeYtLink() {
  if (!selectedCountry || !window.__fbReady) return;
  const existing = worldData[selectedCountry.code] || {};
  const updated = { ...existing, ytLink: '' };
  window.__fbSetCountry(selectedCountry.code, updated)
    .then(() => { toast('track removed'); renderSidebar(selectedCountry.code, selectedCountry.name); })
    .catch(()=>{});
}

function triggerPhotoUpload() { document.getElementById('photo-input').click(); }

function handlePhotoUpload(e) {
  const file = e.target.files[0];
  if (!file || !selectedCountry) return;
  e.target.value = '';
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 600; let w=img.width, h=img.height;
      if (w>MAX) { h=(h/w)*MAX; w=MAX; }
      if (h>MAX) { w=(w/h)*MAX; h=MAX; }
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const b64 = canvas.toDataURL('image/jpeg', 0.72);
      const existing = worldData[selectedCountry.code] || {};
      const photos = [...(existing.photos||[]), b64];
      window.__fbSetCountry(selectedCountry.code, { ...existing, photos })
        .then(() => { renderPhotos(photos); toast('photo pinned'); })
        .catch(() => toast('upload failed'));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function deletePhoto(idx, e) {
  e.stopPropagation();
  if (!selectedCountry || !window.__fbReady) return;
  const existing = worldData[selectedCountry.code] || {};
  const photos = [...(existing.photos||[])];
  photos.splice(idx, 1);
  window.__fbSetCountry(selectedCountry.code, { ...existing, photos })
    .then(() => { renderPhotos(photos); toast('photo removed'); })
    .catch(()=>{});
}

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('on');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('on'); }

function applyVeto() {
  if (!selectedCountry || !window.__fbReady || currentUser!=='A') return;
  const code = selectedCountry.code;
  const expires = Date.now() + 7*24*60*60*1000;
  window.__fbSetVeto(code, { by:'marl', comment:'Не доросла', expires })
    .then(() => { toast(`⊘ вето наложено на ${selectedCountry.name}`); renderSidebar(selectedCountry.code, selectedCountry.name); })
    .catch(() => toast('veto sync error'));
}

/* ══════════════════════════════════════════════════════
   RANDOM ROUTE
══════════════════════════════════════════════════════ */
const FLAGS = {
  FR:'🇫🇷',DE:'🇩🇪',JP:'🇯🇵',BR:'🇧🇷',IT:'🇮🇹',ES:'🇪🇸',PT:'🇵🇹',
  GR:'🇬🇷',TR:'🇹🇷',TH:'🇹🇭',VN:'🇻🇳',ID:'🇮🇩',MA:'🇲🇦',EG:'🇪🇬',
  TN:'🇹🇳',MX:'🇲🇽',AR:'🇦🇷',CL:'🇨🇱',CO:'🇨🇴',PE:'🇵🇪',NL:'🇳🇱',
  BE:'🇧🇪',CH:'🇨🇭',AT:'🇦🇹',CZ:'🇨🇿',PL:'🇵🇱',HU:'🇭🇺',HR:'🇭🇷',
  IS:'🇮🇸',NO:'🇳🇴',SE:'🇸🇪',DK:'🇩🇰',FI:'🇫🇮',IN:'🇮🇳',NP:'🇳🇵',
  KH:'🇰🇭',SG:'🇸🇬',MY:'🇲🇾',PH:'🇵🇭',KR:'🇰🇷',AU:'🇦🇺',NZ:'🇳🇿',
  ZA:'🇿🇦',KE:'🇰🇪',TZ:'🇹🇿',RU:'🇷🇺',US:'🇺🇸',GB:'🇬🇧',CN:'🇨🇳',
};

function randomRoute() {
  const targets = Object.entries(worldData).filter(([,v]) => v.status==='target');
  if (!targets.length) { toast('no target countries yet'); return; }
  const [code] = targets[Math.floor(Math.random()*targets.length)];
  let name = code;
  if (geojsonLayer) {
    geojsonLayer.eachLayer(l => {
      const p = l.feature?.properties;
      if (p && getCountryCode(p)===code) name = p.ADMIN||p.name||p.NAME||code;
    });
  }
  document.getElementById('modal-flag').textContent = FLAGS[code] || '🌍';
  document.getElementById('modal-country').textContent = name;
  document.getElementById('modal-sub').textContent = code + ' — selected at random';
  document.getElementById('route-modal').classList.add('on');
}
function closeRouteModal() { document.getElementById('route-modal').classList.remove('on'); }

/* ══════════════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════════════ */
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.addEventListener('keydown', e => {
  if (e.key==='Escape') { closeLightbox(); closeSidebar(); closeRouteModal(); }
  if (!selectedCountry || e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA') return;
  if (e.key==='1') setStatus('captured');
  if (e.key==='2') setStatus('target');
  if (e.key==='3') setStatus('destroyed');
  if (e.key==='4') setStatus('crusade');
  if (e.key==='x'||e.key==='X') clearStatus();
});

window.addEventListener('resize', () => {
  const sb = document.getElementById('sidebar');
  if (!sb) return;
  if (window.innerWidth > 768) {
    sb.classList.remove('open'); document.body.classList.remove('sb-open');
    document.getElementById('sb-toggle-btn').style.display = 'none';
  } else {
    document.getElementById('sb-toggle-btn').style.display = 'flex';
  }
});
</script>
