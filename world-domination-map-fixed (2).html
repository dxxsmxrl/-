<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, addDoc,
  updateDoc, deleteDoc, serverTimestamp, query, orderBy, limit }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6LtedkEzOcYnPSJF0J1Kax2SvCDk8ym8",
  authDomain: "amina-c23a5.firebaseapp.com",
  projectId: "amina-c23a5",
  storageBucket: "amina-c23a5.firebasestorage.app",
  messagingSenderId: "884214548259",
  appId: "1:884214548259:web:9babd7cc5cb6ce3f8fae96"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

window.__db = db;
window.__fbSetCountry = async (code, data) => {
  await setDoc(doc(db, 'world', code), { ...data, updatedAt: serverTimestamp() }, { merge: true });
};
window.__fbDeleteCountry = async (code) => {
  await deleteDoc(doc(db, 'world', code));
};
window.__fbListenWorld = (cb, onErr) => {
  return onSnapshot(collection(db, 'world'), snap => {
    const data = {};
    snap.forEach(d => { data[d.id] = d.data(); });
    cb(data);
  }, err => {
    if (onErr) onErr(err);
    else console.error('world snapshot error:', err);
  });
};
window.__fbAddComment = async (code, text, author) => {
  // Ensure parent document exists before writing to subcollection
  await setDoc(doc(db, 'world', code), { _exists: true }, { merge: true });
  await addDoc(collection(db, 'world', code, 'comments'), {
    text, author, ts: serverTimestamp()
  });
};
window.__fbListenComments = (code, cb) => {
  const q = query(collection(db, 'world', code, 'comments'), orderBy('ts', 'asc'), limit(50));
  return onSnapshot(q, snap => {
    cb(snap.docs.map(d => ({ id: d.id, ...d.data() })));
  }, (err) => {
    // Silently ignore permission errors on comments (no messages yet)
    if (err.code !== 'permission-denied') console.warn('comments listen error', err);
    cb([]);
  });
};
window.__fbDeleteComment = async (code, id) => {
  await deleteDoc(doc(db, 'world', code, 'comments', id));
};

// Veto system
window.__fbSetVeto = async (code, vetoData) => {
  await setDoc(doc(db, 'vetos', code), { ...vetoData, ts: serverTimestamp() }, { merge: true });
};
window.__fbListenVetos = (cb) => {
  return onSnapshot(collection(db, 'vetos'), snap => {
    const data = {};
    snap.forEach(d => { data[d.id] = d.data(); });
    cb(data);
  });
};
window.__fbClearVeto = async (code) => {
  await deleteDoc(doc(db, 'vetos', code));
};

window.__fbReady = true;
window.dispatchEvent(new Event('fbready'));
</script>

<style>
/* ══════════════════════════════════════════════════════

  flex:1; background:var(--bg3); border:1px solid var(--border2);

  font-family:'DM Mono',monospace; font-size:11px;

  border:1px solid var(--des-border); color:#e0a0a0;

  letter-spacing:1.5px; text-transform:uppercase;
  cursor:pointer; transition:all .2s; border-radius:var(--r);

/* ══════════════════════════════════════════════════════
   MAP CONTROLS (legend + random route + veto panel)
══════════════════════════════════════════════════════ */
.map-controls {
  position:absolute; bottom:24px; left:16px;
  display:flex; flex-direction:column; gap:8px;

}

  background:var(--bg2); border:1px solid var(--border);
  padding:10px 14px; pointer-events:all;
}

/* Random Route button */
.random-route-btn {
  background:var(--bg2); border:1px solid var(--cru-border);
  color:var(--acc2); font-family:'DM Mono',monospace; font-size:10px;
  letter-spacing:1.5px; text-transform:uppercase;
  padding:9px 14px; cursor:pointer; transition:all .2s;
  pointer-events:all;
  display:flex; align-items:center; gap:6px;
}
.random-route-btn:hover { background:var(--cru); box-shadow:0 0 16px rgba(200,146,58,.2); }
.random-route-btn::before { content:'✈'; font-size:13px; }

/* ══════════════════════════════════════════════════════
   LIGHTBOX
══════════════════════════════════════════════════════ */
.lightbox {
  position:fixed; inset:0; background:rgba(0,0,0,.95);
  display:none; align-items:center; justify-content:center; z-index:2000;
}
.lightbox.on { display:flex; }
.lightbox img { max-width:90vw; max-height:90vh; object-fit:contain; }
.lightbox-close { position:absolute; top:20px; right:24px; background:none; border:none; color:#fff; font-size:24px; cursor:pointer; opacity:.6; }
.lightbox-close:hover { opacity:1; }

/* ══════════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════════ */
.toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--bg3); border:1px solid var(--border2);
  color:var(--t1); padding:9px 18px;
  font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.5px;
  box-shadow:var(--shadow-sm); z-index:3000;
  animation:toastIn .2s ease; pointer-events:none;
  white-space:nowrap; max-width:90vw; overflow:hidden; text-overflow:ellipsis;
}
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(6px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

/* ══════════════════════════════════════════════════════
   COUNTRY TOOLTIP
══════════════════════════════════════════════════════ */
.no-bg-tooltip .leaflet-tooltip {
  background:none !important; border:none !important;
  box-shadow:none !important; padding:0 !important;
}
.country-tooltip {
  background:var(--bg2); border:1px solid var(--border2);
  color:var(--t1); padding:4px 10px;
  font-family:'DM Mono',monospace; font-size:10px;
  letter-spacing:1px; pointer-events:none; white-space:nowrap;
}

/* Map animations */
@keyframes targetGlow { 0%,100%{opacity:.7}50%{opacity:1} }
@keyframes crusadeFlicker { 0%,100%{opacity:1}40%{opacity:.7}60%{opacity:.95} }

/* ══════════════════════════════════════════════════════
   MOBILE
══════════════════════════════════════════════════════ */
.sidebar-toggle {
  display:none; position:fixed; bottom:24px; right:16px; z-index:500;
  width:44px; height:44px;
  background:var(--acc); border:none; color:#fff;
  font-size:20px; cursor:pointer; border-radius:var(--r);
  align-items:center; justify-content:center;
  box-shadow:var(--glow-red);
}
@media (max-width:768px) {
  .sidebar { position:absolute; right:0; top:0; bottom:0; width:300px; transform:translateX(100%); transition:transform .3s ease; border-left:1px solid var(--border); }
  .sidebar.open { transform:translateX(0); }
  .sidebar.collapsed { transform:translateX(100%); width:300px; }
  body.sb-open #map { filter:brightness(.5); }
  .stat-badge { display:none; }
  .tb-progress { display:none; }
}

/* ══════════════════════════════════════════════════════
   RANDOM ROUTE MODAL
══════════════════════════════════════════════════════ */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.85);
  display:none; align-items:center; justify-content:center; z-index:1500;
}
.modal-overlay.on { display:flex; }
.modal-box {
  background:var(--bg2); border:1px solid var(--border2);
  padding:40px; max-width:360px; width:90%;
  text-align:center; box-shadow:var(--shadow);
  animation:toastIn .25s ease;
}
.modal-title { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:3px; color:var(--t2); text-transform:uppercase; margin-bottom:16px; }
.modal-country { font-family:var(--font-serif); font-size:36px; color:var(--t1); margin-bottom:8px; }
body:not(.monke) .modal-country { font-family:var(--font-head); font-size:28px; letter-spacing:3px; text-transform:uppercase; }
.modal-flag { font-size:48px; margin-bottom:16px; display:block; }
.modal-sub { font-family:'DM Mono',monospace; font-size:10px; color:var(--acc2); letter-spacing:2px; margin-bottom:28px; }
.modal-close-btn {
  padding:10px 24px; background:var(--acc); border:none;
  color:#fff; font-family:'DM Mono',monospace; font-size:10px;
  letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:all .2s;
}
.modal-close-btn:hover { opacity:.85; }

/* sync status */
#sync-status {
  position:fixed; bottom:8px; right:16px;
  font-family:'DM Mono',monospace; font-size:8px; letter-spacing:1px;
  color:var(--t3); z-index:100; pointer-events:none;
}
</style>
</head>

<!-- Leaflet loaded here so L is guaranteed defined before initMap() runs -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ══════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════ */
let currentUser = null;
let currentTheme = 'dark';
let selectedCountry = null;
let worldData = {};
let vetoData = {};
let commentUnsub = null;
let worldUnsub = null;
let vetoUnsub = null;
let map = null;
let geojsonLayer = null;
const TOTAL_COUNTRIES = 195;

/* ══════════════════════════════════════════════════════
   AUTH
══════════════════════════════════════════════════════ */
function selectUser(u) {
  currentUser = u;
  document.getElementById('ubtn-a').classList.toggle('selected', u === 'A');
  document.getElementById('ubtn-b').classList.toggle('selected', u === 'B');
  document.getElementById('enter-btn').disabled = false;
}
function selectTheme(t) {
  currentTheme = t;
  document.getElementById('tbtn-dark').classList.toggle('active', t === 'dark');
  document.getElementById('tbtn-monke').classList.toggle('active', t === 'monke');
  document.body.classList.toggle('monke', t === 'monke');
}
function enterApp() {
  if (!currentUser) return;
  document.getElementById('auth').style.display = 'none';
  document.getElementById('app').classList.add('on');
  const name = currentUser === 'A' ? 'marl' : 'amina';
  document.getElementById('tb-username').textContent = name;
  document.body.classList.toggle('monke', currentTheme === 'monke');
  initMap();
  initFirebase();
  if (window.innerWidth <= 768) document.getElementById('sb-toggle-btn').style.display = 'flex';
}

/* ══════════════════════════════════════════════════════
   THEME TOGGLE
══════════════════════════════════════════════════════ */
function toggleThemeApp() {
  currentTheme = currentTheme === 'dark' ? 'monke' : 'dark';
  document.body.classList.toggle('monke', currentTheme === 'monke');
  if (map && tileLayer) { map.removeLayer(tileLayer); }
  if (map) {
    const tileUrl = currentTheme === 'monke'
      ? 'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png'
      : 'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png';
    tileLayer = L.tileLayer(tileUrl, { subdomains:'abcd', maxZoom:20, opacity:0 }).addTo(map);
  }
  if (geojsonLayer) geojsonLayer.setStyle(countryStyle);
  toast(currentTheme === 'monke' ? '◦ For Monke' : '▪ for marl');
}

/* ══════════════════════════════════════════════════════
   SIDEBAR
══════════════════════════════════════════════════════ */
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  if (window.innerWidth <= 768) {
    sb.classList.toggle('open');
    document.body.classList.toggle('sb-open', sb.classList.contains('open'));
  } else {
    sb.classList.toggle('collapsed');
  }
}
function closeSidebar() {
  const sb = document.getElementById('sidebar');
  if (window.innerWidth <= 768) { sb.classList.remove('open'); document.body.classList.remove('sb-open'); }
  else sb.classList.add('collapsed');
}
function openSidebar() {
  const sb = document.getElementById('sidebar');
  if (window.innerWidth <= 768) { sb.classList.add('open'); document.body.classList.add('sb-open'); }
  else sb.classList.remove('collapsed');
}

/* ══════════════════════════════════════════════════════
   FIREBASE
══════════════════════════════════════════════════════ */
function initFirebase() {
  if (!window.__fbReady) { window.addEventListener('fbready', initFirebase, { once:true }); return; }
  setSyncStatus('connected');

  if (worldUnsub) worldUnsub();
  worldUnsub = window.__fbListenWorld(
    data => {
      worldData = data || {};
      if (geojsonLayer) geojsonLayer.setStyle(countryStyle);
      updateStats();
      if (selectedCountry) renderSidebar(selectedCountry.code, selectedCountry.name);
    },
    err => {
      setSyncStatus('error');
      toast('⚠ Firebase: ' + (err.code === 'permission-denied'
        ? 'нет доступа — открой правила Firestore'
        : err.message));
    }
  );

  if (vetoUnsub) vetoUnsub();
  vetoUnsub = window.__fbListenVetos(data => {
    vetoData = data || {};
    // purge expired vetos
    const now = Date.now();
    for (const code in vetoData) {
      const v = vetoData[code];
      if (v.expires && v.expires < now) {
        window.__fbClearVeto(code);
        delete vetoData[code];
      }
    }
    if (selectedCountry) renderVetoBadge(selectedCountry.code);
  });
}

function setSyncStatus(s) {
  const el = document.getElementById('sync-status');
  if (s === 'connected') el.textContent = '';
  else el.textContent = 'sync error';
}

/* ══════════════════════════════════════════════════════
   MAP
══════════════════════════════════════════════════════ */
let tileLayer = null;
function initMap() {
  if (typeof L === 'undefined') { setTimeout(initMap, 100); return; }
  map = L.map('map', { center:[20,10], zoom:2, minZoom:1, maxZoom:8, zoomControl:true, attributionControl:false });
  const tileUrl = document.body.classList.contains('monke')
    ? 'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png'
    : 'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png';
  tileLayer = L.tileLayer(tileUrl, { subdomains:'abcd', maxZoom:20, opacity:0 }).addTo(map);
  loadGeoJSON();
}

async function loadGeoJSON() {
  try {
    const res = await fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson');
    const data = await res.json();
    renderGeoJSON(data);
  } catch(e) {
    toast('map data load failed');
  }
}

// Some countries have ISO_A2 = "-99" in natural earth data — map them by ISO_A3
const ISO3_TO_ISO2 = {
  'FRA':'FR','NOR':'NO','SWE':'SE','FIN':'FI','DNK':'DK','RUS':'RU',
  'KOS':'XK','PSE':'PS','ESH':'EH','ATC':'AQ','SJM':'SJ','GUF':'GF',
  'REU':'RE','MTQ':'MQ','GLP':'GP','MYT':'YT','NCL':'NC','PYF':'PF',
  'SPM':'PM','WLF':'WF','BLM':'BL','MAF':'MF','TWN':'TW','SAH':'EH',
  'CYN':'-99','KAS':'-99','SOL':'-99','ISL':'IS'
};

function getCountryCode(props) {
  let code = props.ISO_A2 || props.iso_a2 || '';
  if (!code || code === '-99') {
    const a3 = props.ISO_A3 || props.iso_a3 || props.ADM0_A3 || '';
    code = ISO3_TO_ISO2[a3] || a3 || (props.ADMIN||'').slice(0,3).toUpperCase();
  }
  return code;
}

function countryStyle(feature) {
  const code = getCountryCode(feature.properties);
  const data = worldData[code];
  const status = data ? data.status : null;
  const isDark = !document.body.classList.contains('monke');
  const veto = vetoData[code];
  const isVetoed = veto && veto.expires > Date.now();

  let fillColor, fillOpacity = 0.82, weight = isDark ? 0.5 : 0.8;
  let color = isDark ? '#000' : '#9a8f7a';
  let dashArray = null;

  if (isVetoed && status === 'target') {
    fillColor = getCS('--map-des');
    dashArray = '3,3';
    color = isDark ? '#8b1a1a' : '#aa6a6a';
    weight = 1.5;
  } else {
    switch(status) {
      case 'captured':  fillColor = getCS('--map-cap'); break;
      case 'target':    fillColor = getCS('--map-tgt'); fillOpacity=0.7; dashArray='4,4'; color=isDark?'#3a3aaa':'#4a5fa8'; weight=1.5; break;
      case 'destroyed': fillColor = getCS('--map-des'); fillOpacity=0.75; dashArray='2,3'; break;
      case 'crusade':   fillColor = getCS('--map-cru'); dashArray='6,3'; color=isDark?'#c8962a':'#8b6010'; weight=1.5; break;
      default:          fillColor = getCS('--map-none'); fillOpacity=isDark?0.85:0.6;
    }
  }
  return { fillColor, fillOpacity, weight, color, dashArray };
}

function getCS(v) {
  return getComputedStyle(document.body).getPropertyValue(v).trim();
}

function onEachFeature(feature, layer) {
  const name = feature.properties.ADMIN || feature.properties.name || feature.properties.NAME || 'Unknown';
  const code = getCountryCode(feature.properties);

  layer.on({
    mouseover: (e) => {
      const l = e.target;
      const st = worldData[code]?.status;
      if (!st) l.setStyle({ fillOpacity:0.95, weight:1.2, color:'#888' });
      else l.setStyle({ weight:1.5, fillOpacity:1 });
      l.bringToFront();
      l.bindTooltip(`<div class="country-tooltip">${name}</div>`, { sticky:true, className:'no-bg-tooltip' }).openTooltip();
    },
    mouseout: (e) => { geojsonLayer.resetStyle(e.target); e.target.closeTooltip(); },
    click: () => {
      selectedCountry = { code, name };
      renderSidebar(code, name);
      openSidebar();
    }
  });
}

function renderGeoJSON(data) {
  if (geojsonLayer) geojsonLayer.remove();
  geojsonLayer = L.geoJSON(data, { style:countryStyle, onEachFeature }).addTo(map);
  updateStats();
}

/* ══════════════════════════════════════════════════════
   STATS
══════════════════════════════════════════════════════ */
function updateStats() {
  let cap=0, tgt=0, des=0, cru=0;
  for (const code in worldData) {
    const s = worldData[code]?.status;
    if (s==='captured') cap++;
    else if (s==='target') tgt++;
    else if (s==='destroyed') des++;
    else if (s==='crusade') cru++;
  }
  const pct = Math.round((cap/TOTAL_COUNTRIES)*100);
  document.getElementById('pct-label').textContent = pct+'%';
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('cap-count').textContent = cap+'/'+TOTAL_COUNTRIES;
  document.getElementById('cnt-cap').textContent = cap;
  document.getElementById('cnt-tgt').textContent = tgt;
  document.getElementById('cnt-cru').textContent = cru;
}

/* ══════════════════════════════════════════════════════
   SIDEBAR RENDER
══════════════════════════════════════════════════════ */
function renderSidebar(code, name) {
  document.getElementById('sb-name').textContent = name;
  document.getElementById('sb-code').textContent = code;
  document.getElementById('sb-status-row').style.display = 'flex';

  // Highlight active status pill
  const currentStatus = (worldData[code] || {}).status;
  document.querySelectorAll('.status-pill').forEach(btn => btn.classList.remove('active'));
  if (currentStatus) {
    const map = { captured:'cap', target:'tgt', destroyed:'des', crusade:'cru' };
    const cls = map[currentStatus];
    if (cls) document.querySelector(`.status-pill.${cls}`)?.classList.add('active');
  }

  renderVetoBadge(code);

  const data = worldData[code] || {};
  const body = document.getElementById('sb-body');
  const ytLink = data.ytLink || '';
  const isMarl = currentUser === 'A';
  const veto = vetoData[code];
  const isVetoed = veto && veto.expires > Date.now();

  // Veto button — only marl (A) can veto, only when status is 'target'
  const vetoHtml = isMarl && data.status === 'target' && !isVetoed
    ? `<button class="veto-btn" onclick="applyVeto()">⊘ наложить вето — «Не доросла»</button>`
    : '';

  body.innerHTML = `
    <!-- NOTES -->
    <div class="sidebar-section">
      <div class="sec-label">intel / notes</div>
      <textarea class="notes-area" id="notes-area" placeholder="Add intelligence notes...">${esc(data.notes || '')}</textarea>
      <div class="clearfix"><button class="save-notes-btn" onclick="saveNotes()">save intel</button></div>
    </div>

    <!-- YOUTUBE TRACK -->
    <div class="sidebar-section">
      <div class="sec-label">🎵 associated track</div>
      ${ytLink
        ? `<div class="yt-link-saved">
            <a href="${esc(ytLink)}" target="_blank" rel="noopener">▶ open on youtube</a>
            <button class="yt-del-btn" onclick="removeYtLink()" title="remove">✕</button>
           </div>`
        : `<div class="yt-input-row">
            <input class="yt-input" id="yt-input" placeholder="paste youtube link..." value="">
            <button class="yt-btn" onclick="saveYtLink()">save</button>
           </div>`
      }
    </div>

    <!-- PHOTOS -->
    <div class="sidebar-section">
      <div class="sec-label">field photos</div>
      <div class="photos-grid" id="photos-grid"></div>
      <button class="upload-photo-btn" onclick="triggerPhotoUpload()">+ upload photo</button>
    </div>

    <!-- VETO (marl only) -->
    ${vetoHtml ? `<div class="sidebar-section">${vetoHtml}</div>` : ''}

    <!-- COMMENTS -->
    <div class="sidebar-section">
      <div class="sec-label">dispatch / comms</div>
      <div class="comments-list" id="comments-list"><div class="empty-state">no dispatches yet</div></div>
      <div class="comment-input-row">
        <input class="comment-input" id="comment-input" placeholder="send dispatch..." onkeydown="if(event.key==='Enter')sendComment()">
        <button class="comment-send" onclick="sendComment()">send</button>
      </div>
    </div>
  `;

  renderPhotos(data.photos || []);

  if (commentUnsub) { commentUnsub(); commentUnsub = null; }
  if (window.__fbReady) commentUnsub = window.__fbListenComments(code, renderComments);
}

function renderVetoBadge(code) {
  const el = document.getElementById('sb-veto-display');
  if (!el) return;
  const veto = vetoData[code];
  const now = Date.now();
  if (veto && veto.expires > now) {
    const days = Math.ceil((veto.expires - now) / 86400000);
    el.innerHTML = `<div class="veto-badge">
      ⊘ ВЕТО — «Не доросла»
      <div class="veto-expires">заблокировано ещё ${days} дн.</div>
    </div>`;
  } else {
    el.innerHTML = '';
  }
}

function renderPhotos(photos) {
  const grid = document.getElementById('photos-grid');
  if (!grid) return;
  grid.innerHTML = '';
  (photos || []).forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'photo-thumb';
    div.innerHTML = `<img src="${p}" alt="photo" onclick="openLightbox('${p}')"><button class="del-photo" onclick="deletePhoto(${i},event)">✕</button>`;
    grid.appendChild(div);
  });
}

function renderComments(comments) {
  const list = document.getElementById('comments-list');
  if (!list) return;
  if (!comments.length) { list.innerHTML = '<div class="empty-state">no dispatches yet</div>'; return; }
  const myName = currentUser === 'A' ? 'marl' : 'amina';
  list.innerHTML = '';
  comments.forEach(c => {
    const div = document.createElement('div');
    div.className = 'comment';
    div.innerHTML = `
      <div style="flex:1">
        <div class="comment-author">${esc(c.author || '?')}</div>
        <div class="comment-text">${esc(c.text)}</div>
      </div>
      ${c.author === myName ? `<button class="comment-del" onclick="deleteComment('${c.id}')">✕</button>` : ''}
    `;
    list.appendChild(div);
  });
  list.scrollTop = list.scrollHeight;
}

/* ══════════════════════════════════════════════════════
   ACTIONS
══════════════════════════════════════════════════════ */
function setStatus(status) {
  if (!selectedCountry || !window.__fbReady) { toast('select a country first'); return; }
  const code = selectedCountry.code;

  // Check veto
  const veto = vetoData[code];
  if (status === 'target' && veto && veto.expires > Date.now()) {
    toast('⊘ вето активно — «Не доросла»');
    return;
  }

  const existing = worldData[code] || {};
  const newData = { ...existing, status, setBy: currentUser };
  // Optimistic update — don't wait for Firebase roundtrip
  worldData[code] = newData;
  if (geojsonLayer) geojsonLayer.setStyle(countryStyle);
  updateStats();
  renderVetoBadge(code);

  window.__fbSetCountry(code, newData)
    .catch(() => { toast('sync error'); });
  toast(`${selectedCountry.name} → ${status}`);
}

function clearStatus() {
  if (!selectedCountry || !window.__fbReady) return;
  const code = selectedCountry.code;
  delete worldData[code];
  if (geojsonLayer) geojsonLayer.setStyle(countryStyle);
  updateStats();
  window.__fbDeleteCountry(code).catch(() => {});
  toast(`${selectedCountry.name} cleared`);
}

function saveNotes() {
  if (!selectedCountry || !window.__fbReady) return;
  const notes = document.getElementById('notes-area')?.value || '';
  const existing = worldData[selectedCountry.code] || {};
  window.__fbSetCountry(selectedCountry.code, { ...existing, notes }).catch(() => toast('sync error'));
  toast('intel saved');
}

function sendComment() {
  if (!selectedCountry || !window.__fbReady) return;
  const inp = document.getElementById('comment-input');
  const text = inp?.value.trim();
  if (!text) return;
  const authorName = currentUser === 'A' ? 'marl' : 'amina';
  inp.value = '';
  window.__fbAddComment(selectedCountry.code, text, authorName).catch(() => toast('dispatch failed'));
}

function deleteComment(id) {
  if (!selectedCountry || !window.__fbReady || !id) return;
  window.__fbDeleteComment(selectedCountry.code, id).catch(() => {});
}

/* ══════════════════════════════════════════════════════
   YOUTUBE LINK
══════════════════════════════════════════════════════ */
function saveYtLink() {
  if (!selectedCountry || !window.__fbReady) return;
  const inp = document.getElementById('yt-input');
  const url = inp?.value.trim();
  if (!url) return;
  const existing = worldData[selectedCountry.code] || {};
  window.__fbSetCountry(selectedCountry.code, { ...existing, ytLink: url })
    .then(() => { toast('track linked'); renderSidebar(selectedCountry.code, selectedCountry.name); })
    .catch(() => toast('sync error'));
}

function removeYtLink() {
  if (!selectedCountry || !window.__fbReady) return;
  const existing = worldData[selectedCountry.code] || {};
  const updated = { ...existing };
  delete updated.ytLink;
  window.__fbSetCountry(selectedCountry.code, { ...updated, ytLink: '' })
    .then(() => { toast('track removed'); renderSidebar(selectedCountry.code, selectedCountry.name); })
    .catch(() => {});
}

/* ══════════════════════════════════════════════════════
   PHOTOS
══════════════════════════════════════════════════════ */
function triggerPhotoUpload() { document.getElementById('photo-input').click(); }

function handlePhotoUpload(e) {
  const file = e.target.files[0];
  if (!file || !selectedCountry) return;
  e.target.value = '';
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 600;
      let w = img.width, h = img.height;
      if (w > MAX) { h = (h/w)*MAX; w = MAX; }
      if (h > MAX) { w = (w/h)*MAX; h = MAX; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const b64 = canvas.toDataURL('image/jpeg', 0.72);
      const existing = worldData[selectedCountry.code] || {};
      const photos = [...(existing.photos || []), b64];
      window.__fbSetCountry(selectedCountry.code, { ...existing, photos })
        .then(() => { renderPhotos(photos); toast('photo pinned'); })
        .catch(() => toast('upload failed'));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function deletePhoto(idx, e) {
  e.stopPropagation();
  if (!selectedCountry || !window.__fbReady) return;
  const existing = worldData[selectedCountry.code] || {};
  const photos = [...(existing.photos || [])];
  photos.splice(idx, 1);
  window.__fbSetCountry(selectedCountry.code, { ...existing, photos })
    .then(() => { renderPhotos(photos); toast('photo removed'); })
    .catch(() => {});
}

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('on');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('on'); }

/* ══════════════════════════════════════════════════════
   VETO SYSTEM
══════════════════════════════════════════════════════ */
function applyVeto() {
  if (!selectedCountry || !window.__fbReady || currentUser !== 'A') return;
  const code = selectedCountry.code;
  const expires = Date.now() + 7 * 24 * 60 * 60 * 1000; // 1 week
  window.__fbSetVeto(code, { by: 'marl', comment: 'Не доросла', expires })
    .then(() => {
      toast(`⊘ вето наложено на ${selectedCountry.name}`);
      renderSidebar(selectedCountry.code, selectedCountry.name);
    })
    .catch(() => toast('veto sync error'));
}

/* ══════════════════════════════════════════════════════
   RANDOM ROUTE
══════════════════════════════════════════════════════ */
const COUNTRY_FLAGS = {
  FR:'🇫🇷',DE:'🇩🇪',JP:'🇯🇵',BR:'🇧🇷',IT:'🇮🇹',ES:'🇪🇸',PT:'🇵🇹',
  GR:'🇬🇷',TR:'🇹🇷',TH:'🇹🇭',VN:'🇻🇳',ID:'🇮🇩',MA:'🇲🇦',EG:'🇪🇬',
  TN:'🇹🇳',MX:'🇲🇽',AR:'🇦🇷',CL:'🇨🇱',CO:'🇨🇴',PE:'🇵🇪',NL:'🇳🇱',
  BE:'🇧🇪',CH:'🇨🇭',AT:'🇦🇹',CZ:'🇨🇿',PL:'🇵🇱',HU:'🇭🇺',HR:'🇭🇷',
  IS:'🇮🇸',NO:'🇳🇴',SE:'🇸🇪',DK:'🇩🇰',FI:'🇫🇮',IN:'🇮🇳',NP:'🇳🇵',
  KH:'🇰🇭',SG:'🇸🇬',MY:'🇲🇾',PH:'🇵🇭',KR:'🇰🇷',AU:'🇦🇺',NZ:'🇳🇿',
  ZA:'🇿🇦',KE:'🇰🇪',TZ:'🇹🇿',ET:'🇪🇹',GH:'🇬🇭',SN:'🇸🇳',
};

function randomRoute() {
  const targets = Object.entries(worldData).filter(([,v]) => v.status === 'target');
  if (!targets.length) { toast('no target countries yet'); return; }
  const [code, data] = targets[Math.floor(Math.random() * targets.length)];
  // Find name from geojson layer
  let name = code;
  if (geojsonLayer) {
    geojsonLayer.eachLayer(l => {
      const p = l.feature?.properties;
      const c = p?.ISO_A2 || p?.iso_a2 || p?.ISO_A3;
      if (c === code) name = p?.ADMIN || p?.name || p?.NAME || code;
    });
  }
  const flag = COUNTRY_FLAGS[code] || '🌍';
  document.getElementById('modal-flag').textContent = flag;
  document.getElementById('modal-country').textContent = name;
  document.getElementById('modal-sub').textContent = code + ' — selected at random';
  document.getElementById('route-modal').classList.add('on');
}

function closeRouteModal() { document.getElementById('route-modal').classList.remove('on'); }

/* ══════════════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════════════ */
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* Keyboard shortcuts */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeLightbox(); closeSidebar(); closeRouteModal(); }
  if (!selectedCountry || e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA') return;
  if (e.key==='1') setStatus('captured');
  if (e.key==='2') setStatus('target');
  if (e.key==='3') setStatus('destroyed');
  if (e.key==='4') setStatus('crusade');
  if (e.key==='x'||e.key==='X') clearStatus();
});

window.addEventListener('resize', () => {
  const sb = document.getElementById('sidebar');
  if (window.innerWidth > 768) {
    sb.classList.remove('open'); document.body.classList.remove('sb-open');
    document.getElementById('sb-toggle-btn').style.display = 'none';
  } else {
    document.getElementById('sb-toggle-btn').style.display = 'flex';
  }
});
</script>
